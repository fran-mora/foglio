<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foglio</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- data-tauri-drag-region is what actually makes the strip draggable.
         -webkit-app-region is an Electron/Chromium feature and does nothing in
         the WKWebView Tauri uses on macOS. -->
    <div id="titlebar" data-tauri-drag-region>
      <button id="export-pdf" title="Export to PDF">Export PDF</button>
    </div>
    <div id="editor"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
