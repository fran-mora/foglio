name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    name: markdown helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  rust:
    name: rust helpers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # tauri-build reads the built frontend, so it has to exist before cargo runs.
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
